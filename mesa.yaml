# yaml-language-server: $schema=https://raw.githubusercontent.com/chainguard-dev/apko/refs/heads/main/pkg/build/types/schema.json
include: bootc.yaml
contents:
  packages:
    # Graphics / GPU
    - mesa-full
    - mesa-full-egl
    - mesa-full-gbm
    - mesa-full-glx
    - mesa-full-libgallium
    - intel-media-driver
    - libva
    - linux-firmware
    - spirv-tools # remove on mesa-full bump

    # GTK / Icons
    - gtk-3-compiled-gschemas
    - hicolor-icon-theme
    - glycin-2

    # Wayland desktop utilities
    - kitty
    - fuzzel
    - grim
    - mako
    - slurp
    - swaybg
    - swayidle
    - swaylock
    - wl-clipboard
    - brightnessctl
    - playerctl

    # Audio
    - wireplumber
    - pipewire-full
    - sof-firmware

    # Networking
    - conntrack-tools
    - curl
    - ethtool
    - iproute2
    - iwd
    - wireless-regdb
    - nftables
    - systemd-default-network

    # SSH
    - gpg
    - openssh
    - openssh-service
    - openssl

    # Rootless containers
    - just-newuidmap-newgidmap
    - podman
    - docker-compose
    - slirp4netns

    # Shell
    - bash-completion
    - bash-default-config
    - git
    - less
    - delta

    # System / diagnostics
    - fastfetch
    - fzf
    - htop
    - just
    - neovim
    - pciutils
    - lm-sensors
    - powertop-service

    # Fonts
    - font-liberation
    - font-noto
    - font-noto-cjk
    - font-noto-emoji
    - ttf-dejavu

    # Shell
    - zsh
    - zsh-autosuggestions
    - zsh-history-substring-search
    - zsh-syntax-highlighting
paths:
  - path: /usr/bin/unix_chkpwd
    type: permissions
    permissions: 0o4755
archs:
  - amd64
